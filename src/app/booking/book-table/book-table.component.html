<div class="booking-container">
  <div class="header">
    <h2>Table Bookings</h2>
    <button class="add-btn" (click)="toggleForm()">
      {{ showForm ? 'Cancel' : 'New Booking' }}
    </button>
  </div>

  <!-- Booking Form -->
  <div *ngIf="showForm" class="booking-form">
    <h3>Create New Booking</h3>
    <form (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="customerName">Customer Name:</label>
        <input id="customerName" type="text" [(ngModel)]="newBooking.customerName" name="customerName" required class="form-control">
      </div>

      <div class="form-group">
        <label for="date">Date:</label>
        <input id="date" type="date" [(ngModel)]="newBooking.date" name="date" required class="form-control">
      </div>

      <div class="form-group">
        <label for="time">Time:</label>
        <input id="time" type="time" [(ngModel)]="newBooking.time" name="time" required class="form-control">
      </div>

      <div class="form-group">
        <label for="guests">Number of Guests:</label>
        <input id="guests" type="number" [(ngModel)]="newBooking.guests" name="guests" min="1" max="20" required class="form-control">
      </div>

      <div class="form-actions">
        <button type="submit" [disabled]="loading" class="submit-btn">
          {{ loading ? 'Creating...' : 'Create Booking' }}
        </button>
      </div>
    </form>
  </div>

  <div class="bookings-list" *ngIf="bookings.length > 0">
    <div class="bookings-grid">
      <div *ngFor="let booking of bookings" class="booking-card">
        <div class="booking-header">
          <h4>{{ booking.customerName }}</h4>
          <button class="delete-btn" (click)="deleteBooking(booking)">×</button>
        </div>

        <div class="booking-details">
          <div class="detail-item">
            <span class="label">Date:</span>
            <span class="value">{{ booking.date }}</span>
          </div>
          <div class="detail-item">
            <span class="label">Time:</span>
            <span class="value">{{ booking.time }}</span>
          </div>
          <div class="detail-item">
            <span class="label">Guests:</span>
            <span class="value">{{ booking.guests }}</span>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
